name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Check Python and shell syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/*.sh

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
